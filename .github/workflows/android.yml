name: Build Android APK

on:
  push:
    branches: [main, "feature/**"]
  workflow_dispatch:

jobs:
  export-android:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.4.1"
      GODOT_RELEASE: "stable"
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack uploaded Godot project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'gamegro_tropical_cove_level1*.zip' -print -quit)"
          test -n "$ZIP_FILE"
          mkdir -p packaged
          unzip -q "$ZIP_FILE" -d packaged
          test -f packaged/project.godot
          test -f packaged/export_presets.cfg
          test -f packaged/scripts/game.gd

      - name: Enable ETC2 ASTC texture import for Android
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("packaged/project.godot")
          s = p.read_text(encoding="utf-8")
          key = "textures/vram_compression/import_etc2_astc=true"
          if key not in s:
              if "[rendering]" in s:
                  s = s.replace("[rendering]", "[rendering]\n" + key, 1)
              else:
                  s += "\n[rendering]\n" + key + "\n"
          p.write_text(s, encoding="utf-8")
          PY

      - name: Fix explicit GDScript types in uploaded project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("packaged/scripts/game.gd")
          source = path.read_text(encoding="utf-8")
          replacements = {
              "var scaled := ": "var scaled: Vector2 = ",
              "var min_x := ": "var min_x: float = ",
              "var min_y := ": "var min_y: float = ",
          }
          for old, new in replacements.items():
              source = source.replace(old, new)
          path.write_text(source, encoding="utf-8")
          PY

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" "platforms;android-35" "build-tools;35.0.1" "ndk;27.2.12479018"

      - name: Download Godot 4.4.1 and export templates
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}"
          curl -fL "$BASE/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip" -o godot.zip
          curl -fL "$BASE/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz" -o templates.tpz
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64" godot
          chmod +x godot
          unzip -q templates.tpz -d templates
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          cp -a templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}/"

      - name: Create debug keystore
        shell: bash
        run: |
          mkdir -p packaged/keystore
          keytool -genkeypair -v -keystore packaged/keystore/debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Configure Android export preset
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("packaged/export_presets.cfg")
          s = p.read_text(encoding="utf-8")
          section = "[preset.0.options]"
          if section not in s:
              raise SystemExit("Android export options section not found")
          head, tail = s.split(section, 1)
          lines = tail.splitlines()
          values = {
              "keystore/debug": str(Path("packaged/keystore/debug.keystore").resolve()),
              "keystore/debug_user": "androiddebugkey",
              "keystore/debug_password": "android",
          }
          for key, value in values.items():
              import re
              pattern = re.compile(r"(?m)^" + re.escape(key) + r"=.*$")
              replacement = key + '="' + value.replace("\\", "\\\\").replace('"', '\\"') + '"'
              if pattern.search(tail):
                  tail = pattern.sub(lambda _: replacement, tail, count=1)
              else:
                  tail = "\n" + replacement + tail
          p.write_text(head + section + tail, encoding="utf-8")
          print(p.read_text(encoding="utf-8"))
          PY

      - name: Configure Godot Android settings
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$GITHUB_WORKSPACE/packaged/keystore/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Verify Android export configuration
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Android project setting ==="
          grep -n "import_etc2_astc" packaged/project.godot
          echo "=== Android export preset signing ==="
          grep -E "package/signed|keystore/debug" packaged/export_presets.cfg
          echo "=== SDK tools ==="
          test -x "$ANDROID_HOME/platform-tools/adb"
          find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f -print
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -f packaged/keystore/debug.keystore
          echo "=== Editor settings ==="
          cat "$HOME/.config/godot/editor_settings-4.4.tres"

      - name: Import project and validate GDScript
        shell: bash
        run: ./godot --headless --editor --path packaged --quit

      - name: Export Android APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packaged/build
          ./godot --headless --verbose --path packaged --export-debug "Android" packaged/build/MagicWorld-debug.apk
          test -s packaged/build/MagicWorld-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MagicWorld-Android-debug
          path: packaged/build/MagicWorld-debug.apk
          if-no-files-found: error

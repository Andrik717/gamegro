# Rebuild after runtime asset packaging and splash transition fix.
# Rebuild after the cat splash and touch-navigation update.
name: Build Android APK

on:
  push:
    branches: [main, "feature/**"]
  workflow_dispatch:

jobs:
  export-android:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.4.1"
      GODOT_RELEASE: "stable"
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Unpack uploaded Godot project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'gamegro_tropical_cove_level1*.zip' -print -quit)"
          test -n "$ZIP_FILE"
          mkdir -p packaged
          unzip -q "$ZIP_FILE" -d packaged
          rm -rf packaged/.godot
          test -f packaged/project.godot
          test -f packaged/export_presets.cfg
          test -f packaged/scripts/game.gd

      - name: Install raster artwork dependency
        run: python3 -m pip install --disable-pip-version-check Pillow

      - name: Apply requested gameplay and Android fixes
        run: python3 ci/patch_game.py packaged

      - name: Preserve source script for UI inspection
        uses: actions/upload-artifact@v5
        with:
          name: MagicWorld-source-inspection
          path: packaged/scripts/game.gd
          if-no-files-found: error

      - name: Enable ETC2 ASTC texture import for Android
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packaged/addons/ci_android_settings
          cat > packaged/addons/ci_android_settings/plugin.cfg <<'CFG'
          [plugin]
          name="CI Android Settings"
          description="Android texture import configuration."
          author="Build"
          version="1.0"
          script="plugin.gd"
          CFG
          cat > packaged/addons/ci_android_settings/plugin.gd <<'GD'
          @tool
          extends EditorPlugin
          func _enter_tree():
              ProjectSettings.set_setting("rendering/textures/vram_compression/import_etc2_astc", true)
              ProjectSettings.save()
          GD
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("packaged/project.godot")
          lines = p.read_text(encoding="utf-8").splitlines()
          lines = [line for line in lines if "import_etc2_astc" not in line]
          render = next((i for i, line in enumerate(lines) if re.fullmatch(r"\[rendering\]\s*", line.strip())), None)
          if render is None:
              lines.extend(["", "[rendering]", "textures/vram_compression/import_etc2_astc=true"])
          else:
              lines.insert(render + 1, "textures/vram_compression/import_etc2_astc=true")
          plugins = next((i for i, line in enumerate(lines) if re.fullmatch(r"\[editor_plugins\]\s*", line.strip())), None)
          value = 'enabled=PackedStringArray("res://addons/ci_android_settings/plugin.cfg")'
          if plugins is None:
              lines.extend(["", "[editor_plugins]", value])
          else:
              end = next((i for i in range(plugins + 1, len(lines)) if lines[i].startswith("[")), len(lines))
              lines[plugins + 1:end] = [value]
          p.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Fix explicit GDScript types in uploaded project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("packaged/scripts/game.gd")
          source = path.read_text(encoding="utf-8")
          replacements = {
              "var scaled := ": "var scaled: Vector2 = ",
              "var min_x := ": "var min_x: float = ",
              "var min_y := ": "var min_y: float = ",
          }
          for old, new in replacements.items():
              source = source.replace(old, new)
          path.write_text(source, encoding="utf-8")
          PY

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" "platforms;android-35" "build-tools;35.0.1" "ndk;27.2.12479018"

      - name: Download Godot 4.4.1 and export templates
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}"
          curl -fL "$BASE/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip" -o godot.zip
          curl -fL "$BASE/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz" -o templates.tpz
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64" godot
          chmod +x godot
          unzip -q templates.tpz -d templates
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          cp -a templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}/"

      - name: Create debug keystore
        shell: bash
        run: |
          mkdir -p packaged/keystore
          keytool -genkeypair -v -keystore packaged/keystore/debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Configure Android export preset
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("packaged/export_presets.cfg")
          s = p.read_text(encoding="utf-8")
          section = "[preset.0.options]"
          if section not in s:
              raise SystemExit("Android export options section not found")
          head, tail = s.split(section, 1)
          lines = tail.splitlines()
          values = {
              "keystore/debug": str(Path("packaged/keystore/debug.keystore").resolve()),
              "keystore/debug_user": "androiddebugkey",
              "keystore/debug_password": "android",
          }
          for key, value in values.items():
              import re
              pattern = re.compile(r"(?m)^" + re.escape(key) + r"=.*$")
              replacement = key + '="' + value + '"'
              if pattern.search(tail):
                  tail = pattern.sub(lambda _: replacement, tail, count=1)
              else:
                  tail = "\n" + replacement + tail
          p.write_text(head + section + tail, encoding="utf-8")
          print(p.read_text(encoding="utf-8"))
          PY

      - name: Configure Godot Android settings
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$GITHUB_WORKSPACE/packaged/keystore/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Verify Android export configuration
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Android project setting ==="
          grep -n "import_etc2_astc" packaged/project.godot
          echo "=== Android export preset signing ==="
          grep -E "package/signed|keystore/debug" packaged/export_presets.cfg
          echo "=== SDK tools ==="
          test -x "$ANDROID_HOME/platform-tools/adb"
          find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f -print
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -f packaged/keystore/debug.keystore
          echo "=== Editor settings ==="
          cat "$HOME/.config/godot/editor_settings-4.4.tres"

      - name: Inspect generated GDScript
        if: always()
        shell: bash
        run: |
          if test -f packaged/scripts/game.gd; then
            echo "=== Generated game.gd around reported line ==="
            nl -ba packaged/scripts/game.gd | sed -n '595,620p'
          fi

      - name: Import project and validate GDScript
        shell: bash
        run: |
          set -euo pipefail
          ./godot --headless --editor --path packaged --quit > godot_validation.log 2>&1 || { cat godot_validation.log; exit 1; }
          cat godot_validation.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" godot_validation.log; then
            echo "Godot reported script errors; refusing to export a broken APK."
            exit 1
          fi

      - name: Export Android APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packaged/build
          ./godot --headless --verbose --path packaged --export-debug "Android" build/MagicWorld-debug.apk
          test -s packaged/build/MagicWorld-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: MagicWorld-Android-debug
          path: packaged/build/MagicWorld-debug.apk
          if-no-files-found: error

name: Generate mini-game PNG artwork

on:
  push:
    branches: [main]
    paths:
      - "tools/minigame_svg_source/**"
      - "tools/convert_minigame_assets.py"
      - ".github/workflows/minigame-png-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-artwork:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install SVG rasterizer
        run: python -m pip install --upgrade pip cairosvg
      - name: Render high-resolution transparent PNGs
        run: python tools/convert_minigame_assets.py
      - name: Commit generated PNG artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/minigames/*.png
          if git diff --cached --quiet; then
            echo "PNG artwork is already up to date."
          else
            git commit -m "Add high-resolution PNG mini-game artwork"
            git push origin HEAD:main
          fi
